<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Nadeem's Claude on the glasses: next event, top open items, ask anything. Read-only.">
<meta name="mrbd-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Claude</title>
<style>
  html,body{margin:0;position:relative;width:600px;height:600px;overflow:hidden;background:#000;color:#f2f2f2;font:22px/1.3 system-ui,sans-serif}
  .screen{position:absolute;inset:0;padding:26px 36px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
  .hidden{display:none}
  h1{margin:0;font-size:26px;color:#9fd3ff}
  .status{min-height:26px;font-size:18px;color:#aab}
  button,input{display:block;width:100%;min-height:88px;box-sizing:border-box;border:3px solid #556;border-radius:16px;background:#101418;color:#fff;font:inherit;font-size:24px;text-align:left;padding:0 24px}
  input::placeholder{color:#cfd8ff}
  button:focus,input:focus{outline:none;border-color:#fff;background:#1b2a3a}
  #answer{flex:1;white-space:pre-wrap;overflow:hidden}
  #mnext{font-size:26px;color:#ffd27a;min-height:0}
  #mbody{flex:1;white-space:pre-wrap;overflow:hidden;font-size:20px}
  #q{font-size:18px;color:#9fd3ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<section id="home" class="screen">
  <h1>Claude</h1>
  <div id="status" class="status"></div>
  <button class="focusable" id="meetingBtn">Meeting copilot</button>
  <button class="focusable" data-preset="next">Next up</button>
  <button class="focusable" data-preset="todo">To do, top 3</button>
  <input class="focusable" id="ask" type="text" placeholder="Ask anything…" aria-label="Ask Claude">
</section>
<section id="meeting" class="screen hidden">
  <div id="mstatus" class="status"></div>
  <div id="mnext"></div>
  <div id="mbody"></div>
  <button class="focusable" id="flag">★ Flag this moment</button>
</section>
<section id="result" class="screen hidden">
  <div id="q"></div>
  <div id="answer"></div>
  <button class="focusable" id="speak">Read aloud</button>
</section>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const PRESETS = {
    next: ['Next up', () => `It is now ${new Date().toString()}. In at most two short sentences: my next calendar event today (start time and title), and whether anything is booked inside my protected 9 to 11 AM block. If nothing is left today, say so and name tomorrow's first event.`],
    todo: ['To do, top 3', () => 'From ~/ventures/portfolio/OPEN-ITEMS.md give my top 3 open items right now, one short line each, most urgent first, plain text, no markdown.'],
  };
  // The token and bridge URL arrive once in the install link (#t=...&api=...), then live in localStorage.
  let cfg = {};
  try { cfg = JSON.parse(localStorage.getItem('claude-glasses') || '{}'); } catch (e) {}
  const p = new URLSearchParams((location.hash || '').replace(/^#/, '') || location.search.replace(/^\?/, ''));
  if (p.get('t')) {
    cfg = { t: p.get('t'), api: p.get('api') || cfg.api || 'https://cupbearer-barcode-abacus.ngrok-free.dev' };
    try { localStorage.setItem('claude-glasses', JSON.stringify(cfg)); } catch (e) {}
  }
  history.replaceState({ screen: 'home' }, '', location.pathname);
  $('status').textContent = cfg.t ? 'Read-only. Answers take 5 to 60 s.' : 'Setup needed: open the install link with the token.';

  const focusables = () => Array.from(document.querySelectorAll('.focusable')).filter((el) => el.offsetParent !== null);
  const show = (id) => ['home', 'result', 'meeting'].forEach((s) => $(s).classList.toggle('hidden', s !== id));
  let last = null, timer = null, ctrl = null;

  async function ask(q, label, from) {
    last = from;
    if (ctrl) ctrl.abort();
    const mine = ctrl = new AbortController();
    show('result');
    $('q').textContent = label;
    $('answer').textContent = 'Thinking…';
    history.pushState({ screen: 'result' }, '');
    const t0 = Date.now();
    clearInterval(timer);
    timer = setInterval(() => { $('answer').textContent = `Thinking… ${Math.round((Date.now() - t0) / 1000)}s`; }, 1000);
    const kill = setTimeout(() => mine.abort(), 150000);
    let text;
    try {
      if (!cfg.t) throw new Error('Setup needed: open the install link with the token.');
      const r = await fetch(`${cfg.api}/t/${cfg.t}/ask`, {
        method: 'POST', signal: mine.signal,
        headers: { 'content-type': 'application/json', 'ngrok-skip-browser-warning': '1' },
        body: JSON.stringify({ q }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `Bridge error ${r.status}`);
      text = data.answer || 'No answer.';
    } catch (e) {
      text = e.name === 'AbortError' ? 'Claude took too long. Try a shorter question.' : (e instanceof TypeError ? 'Could not reach the Mac bridge.' : e.message);
    } finally {
      clearTimeout(kill);
    }
    if (ctrl !== mine) return; // a newer question or Back superseded this one
    clearInterval(timer);
    $('answer').textContent = text;
    $('speak').focus();
  }

  document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => {
    const [label, make] = PRESETS[b.dataset.preset];
    ask(make(), label, b);
  }));
  $('ask').addEventListener('change', (e) => {
    const q = e.target.value.trim();
    e.target.value = '';
    if (q) ask(q, q, e.target);
  });
  $('speak').addEventListener('click', () => {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance($('answer').textContent);
    u.onerror = () => {};
    speechSynthesis.speak(u);
  });
  // Meeting copilot: the phone or laptop records; the lens shows the newest card from the Mac.
  let mtimer = null, mlast = '';
  const api = (path, opt) => fetch(`${cfg.api}/t/${cfg.t}${path}`, Object.assign({ headers: { 'ngrok-skip-browser-warning': '1' } }, opt || {}));
  function render(card) {
    const txt = (card.text || '').replace(/\*\*/g, '').replace(/^#+\s*/gm, '');
    const m = txt.match(/Ask next:?\s*(.+)/i);
    $('mnext').textContent = m ? '→ ' + m[1].replace(/^["“]|["”]$/g, '') : '';
    $('mbody').textContent = (m ? txt.replace(m[0], '') : txt).replace(/\n{2,}/g, '\n').trim();
  }
  async function poll() {
    try {
      const r = await api('/meeting');
      const st = await r.json();
      if (!r.ok) throw new Error(st.error || `Bridge error ${r.status}`);
      $('mstatus').textContent = (st.recording ? `● Recording since ${st.since}` : 'Not recording. Start it on the phone or laptop.') + (st.busy ? ' · thinking' : '');
      const key = st.card ? st.card.t + st.card.text : '';
      if (st.card && key !== mlast) { mlast = key; render(st.card); }
      if (!st.card) { $('mnext').textContent = ''; $('mbody').textContent = 'No cards yet.'; }
    } catch (e) {
      $('mstatus').textContent = e instanceof TypeError ? 'Could not reach the Mac bridge.' : e.message;
    }
  }
  $('meetingBtn').addEventListener('click', () => {
    last = $('meetingBtn');
    if (!cfg.t) { $('status').textContent = 'Setup needed: open the install link with the token.'; return; }
    show('meeting'); history.pushState({ screen: 'meeting' }, '');
    mlast = ''; $('mbody').textContent = 'Loading…'; poll();
    clearInterval(mtimer); mtimer = setInterval(poll, 4000);
    $('flag').focus();
  });
  $('flag').addEventListener('click', async () => {
    try { await api('/meeting', { method: 'POST' }); $('mstatus').textContent = '★ Flagged'; } catch (e) { $('mstatus').textContent = 'Flag failed.'; }
  });
  window.addEventListener('popstate', () => {
    clearInterval(mtimer);
    if (ctrl) { ctrl.abort(); ctrl = null; }
    clearInterval(timer);
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    show('home');
    (last || focusables()[0]).focus();
  });
  // Neural Band / touchpad arrive as arrow keys + Enter; there is no pointer, so focus moves here.
  document.addEventListener('keydown', (e) => {
    const list = focusables(), i = list.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
    else if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'BUTTON') { e.preventDefault(); document.activeElement.click(); }
    else if ((e.key === 'Escape' || e.key === 'Backspace') && $('home').classList.contains('hidden')) { e.preventDefault(); history.back(); }
  });
  focusables()[0].focus();
})();
</script>
</body>
</html>
